name: Bug report
description: Something in TraceBrain is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For **security problems**, do not file a public issue; see
        [SECURITY.md](https://github.com/boss477/graphhacks/blob/master/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: 'commit sha'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: 'OS, Python or Node version, Docker or not'
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
