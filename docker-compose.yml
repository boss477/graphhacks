services:
  falkordb:
    image: falkordb/falkordb:1.2.0
    ports:
      - "6379:6379"
    volumes:
      - tracebrain_falkordb:/data
    command: ["--appendonly", "yes", "--dir", "/data"]
  api:
    build: .
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      - falkordb

volumes:
  tracebrain_falkordb:

